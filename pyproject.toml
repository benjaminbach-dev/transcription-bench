[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "transcription-bench"
version = "0.1.0"
description = "Prototype local de comparaison de modèles de transcription française sur CPU"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "av",
    "flask==3.1.3",
    "huggingface_hub",
    "numpy",
    "psutil",
    "waitress==3.0.2",
]

[project.scripts]
transcription-bench = "transcription_bench.cli:main"

[tool.uv.build-backend]
module-root = ""
